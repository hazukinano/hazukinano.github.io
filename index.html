<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>葉月なの | 準備中</title>
  <meta name="description" content="葉月なのポートフォリオサイト（準備中）">
  <style>
    :root {
      --bg: #f7f5f0;
      --text: #2f3a33;
      --sub: #6b7a70;
      --accent: #7a9a7e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d221f;
        --text: #e6ebe7;
        --sub: #9fb0a4;
        --accent: #9cbca0;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
      text-align: center;
      line-height: 1.8;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 500;
      letter-spacing: 0.2em;
      margin-right: -0.2em;
    }
    .en {
      margin-top: 4px;
      font-family: "Helvetica Neue", Arial, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      color: var(--sub);
    }
    .line {
      width: 40px;
      height: 1px;
      margin: 32px auto;
      background: var(--accent);
    }
    p { font-size: 0.95rem; color: var(--sub); }
  </style>
</head>
<body>
  <main>
    <h1>葉月なの</h1>
    <div class="en">HAZUKI NANO</div>
    <div class="line"></div>
    <p>ただいまサイトを準備しています。<br>公開まで、もうしばらくお待ちください。</p>
  </main>
</body>
</html>
